[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"

[project]
name="qdw-federation-lab"
version="0.1.0"
requires-python=">=3.12"
dependencies=[
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyyaml>=6,<7"
]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
