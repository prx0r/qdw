name: QDW Verified CI

on:
  push:
  pull_request:

jobs:
  verified-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact project + build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Canonical VerificationPlan
        run: python scripts/ci_release.py

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qdw-verification-${{ github.sha }}
          path: |
            .qdw/ci/
            BUILD_CERTIFICATE.json

      - name: Upload SARIF
        if: always() && hashFiles('.qdw/ci/static-review/REVIEW.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .qdw/ci/static-review/REVIEW.sarif
