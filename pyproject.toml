[project]
name = "qdw"
version = "0.1.0"
description = "QDW — Autonomous Factory OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "mcp>=2,<3",
    "cryptography>=44,<51",
    "pyyaml>=6,<7",
]

[project.scripts]
qdw = "qdw.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-timeout>=2,<3",
    "pytest-xdist>=3,<4",
    "hypothesis>=6.100,<7",
    "respx>=0.22,<1",
    "ruff>=0.8,<1",
    "pyright>=1.1,<2",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["TC003", "N818", "SIM117", "N806", "SIM108", "E702", "E701"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
venvPath = "."
venv = ".venv"
