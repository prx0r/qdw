<!doctype html><html><head><meta charset="utf-8"><title>QDW Federation Integration Review</title>
<style>
body{font-family:system-ui;background:#0f1115;color:#eee;margin:0}header{position:sticky;top:0;background:#0f1115;border-bottom:1px solid #333;padding:18px;z-index:3}
main{max-width:1350px;margin:auto;padding:20px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.card,.finding{border:1px solid #333;border-radius:10px;padding:14px;background:#171a20} .finding{margin:10px 0}
.CRITICAL{border-left:6px solid #ff453a}.HIGH{border-left:6px solid #ff9f0a}.MEDIUM{border-left:6px solid #ffd60a}
input,select{padding:8px;background:#222;color:#fff;border:1px solid #555;margin:4px}code{background:#252830;padding:2px 5px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #333;padding:8px;text-align:left}.muted{opacity:.65}
</style></head><body><header><b>QDW Federation Integration Review</b> · FEDERATE_NOT_MERGE<br>
<input id=q placeholder="filter findings"><select id=sev><option value="">all severity</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option></select>
</header><main>
<h2>Authority split</h2><div class=grid id=roles></div>
<h2>Pinned repositories</h2><table id=pins></table>
<h2>Findings</h2><div id=findings></div>
<h2>Reference experiment</h2><pre id=experiment></pre>
</main><script>
const R={"schema": "qdw.federation-review.v1", "generated_at": "2026-08-19", "pins": {"qdw": {"repo": "prx0r/qdw", "sha": "cccf6e3ca5f4704eb1c047965d3a3716dec8870b", "role": "canonical economic/orchestration authority"}, "qdw-forge": {"repo": "prx0r/qdw-forge", "sha": "2037cdb93458278bdc4807be8e84111cce72fb10", "role": "capability registry, leases and invocation execution exchange"}, "qdw-sandbox": {"repo": "prx0r/qdw-sandbox", "sha": "5e4278c8eeed008bcf11deff288b19110379ece0", "role": "incubator/donor for Estate, LifeGit, human, data-rights and experimental policies"}, "gitgoblin": {"repo": "prx0r/gitgoblin", "sha": "f7bf8963ee2600d9377a196ff0fd2f32ce5905b3", "role": "frontier technical intelligence oracle"}, "dell": {"repo": "prx0r/dell", "sha": "8aacd297fff0f0c7f48b36ac85ac415deaa7bd68", "role": "model/provider/deal evidence and resource-intelligence oracle"}}, "verdict": "FEDERATE_NOT_MERGE", "authority": {"orchestrator": "qdw", "technical_oracle": "gitgoblin", "resource_oracle": "dell", "execution_exchange": "qdw-forge", "incubator": "qdw-sandbox"}, "findings": [{"id": "FED-R01", "severity": "CRITICAL", "repos": ["qdw", "qdw-sandbox"], "title": "Estate duplicates QDW final routing/verification authority", "resolution": "Sandbox remains incubator; graduate policy math/contracts, disable EstateRouter/EstateVerificationService as production authorities."}, {"id": "FED-R02", "severity": "HIGH", "repos": ["qdw-forge"], "title": "Forge verification trusts caller-authored passed boolean", "resolution": "VerificationCertificateRef + resolver bound to invocation/output; no passed boolean."}, {"id": "FED-R03", "severity": "HIGH", "repos": ["dell", "qdw"], "title": "Dell recommendation would create dual final-route truth if consumed literally", "resolution": "Dell emits ADVISORY candidate snapshot; QDW HotSwap remains final route."}, {"id": "FED-R04", "severity": "HIGH", "repos": ["dell"], "title": "Unknown output token price is currently coerced to zero in workload cost", "resolution": "If output tokens > 0 and output price is unknown, total cost is unknown; frozen regression included."}, {"id": "FED-R05", "severity": "MEDIUM", "repos": ["gitgoblin", "qdw"], "title": "GitGoblin exporter targets legacy VentureLab/Cuntgoblin schema", "resolution": "Versioned QDW ObservationBatch and OpportunityProposal exporter."}, {"id": "FED-R06", "severity": "HIGH", "repos": ["qdw", "qdw-forge"], "title": "Current QDW Route pricing cannot represent Forge per-call assets without fabrication", "resolution": "Generalize Route with fixed_request_cost_usd and persist it."}, {"id": "FED-R07", "severity": "HIGH", "repos": ["qdw", "dell", "qdw-forge"], "title": "External outage can be confused with a legitimate zero-candidate result", "resolution": "Shared ExternalStatus; UNAVAILABLE/STALE/OK_EMPTY are distinct and contract-tested."}, {"id": "FED-R08", "severity": "MEDIUM", "repos": ["qdw", "qdw-forge"], "title": "Forge asset posterior and QDW task posterior represent different populations", "resolution": "Forge profile may seed a sourced prior feature only; QDW maintains independent task-cell posterior."}, {"id": "FED-R09", "severity": "MEDIUM", "repos": ["all"], "title": "Moving repository heads would make certified federation non-reproducible", "resolution": "Pin exact SHAs; automated pin upgrades require protocol diff + full suite."}], "reference_experiment": {"tests": "25/25 PASS", "flow": "GitGoblin observation -> Dell advisory -> QDW final choice -> Forge pinned invocation -> QDW certificate", "native_git_clone": "blocked by container DNS; exact source inspected via GitHub connector"}};
Object.entries(R.authority).forEach(([k,v])=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<b>${k}</b><br><code>${v}</code>`;roles.appendChild(d)});
pins.innerHTML="<tr><th>Repo</th><th>SHA</th><th>Role</th></tr>"+Object.entries(R.pins).map(([k,v])=>`<tr><td>${k}</td><td><code>${v.sha.slice(0,12)}</code></td><td>${v.role}</td></tr>`).join("");
experiment.textContent=JSON.stringify(R.reference_experiment,null,2);
function draw(){let z=q.value.toLowerCase(),s=sev.value;findings.innerHTML="";
R.findings.filter(f=>(!s||f.severity===s)&&(!z||JSON.stringify(f).toLowerCase().includes(z))).forEach(f=>{
let d=document.createElement("div");d.className="finding "+f.severity;d.innerHTML=`<b>${f.severity} · ${f.id}</b> <span class=muted>${f.repos.join(", ")}</span><h3>${f.title}</h3><p><b>Resolution:</b> ${f.resolution}</p>`;findings.appendChild(d)})}
q.oninput=draw;sev.onchange=draw;draw();
</script></body></html>
