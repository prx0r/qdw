[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdw-global-infrastructure-reference"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "cryptography>=43",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
